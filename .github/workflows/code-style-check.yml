name: Code Style Check

on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - 'android/**'
      - '.github/workflows/code-style-check.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Grant execute permission for gradlew
        run: chmod +x ./android/gradlew

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            android/.gradle
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Run ktlint + detekt
        working-directory: android
        run: |
          tasks="$(./gradlew tasks --all --console=plain)"
          selected=()
          grep -q '^ktlintCheck -' <<< "$tasks" && selected+=(ktlintCheck)
          grep -q '^detekt -' <<< "$tasks" && selected+=(detekt)

          if [ ${#selected[@]} -eq 0 ]; then
            echo "::notice::ktlint/detekt가 아직 설정되지 않아 검사를 건너뜁니다."
            exit 0
          fi

          ./gradlew "${selected[@]}" --no-daemon --parallel
        env:
          SERVER_BASE_URL: ${{ secrets.SERVER_BASE_URL || '' }}
          KAKAO_NATIVE_APP_KEY: ${{ secrets.KAKAO_NATIVE_APP_KEY || '' }}
